<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexBank Simple Banking System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <h2 class="login-title">Login to manage your bank</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" value="admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" value="admin123" required>
            </div>

            <button type="submit" class="btn-login">LOGIN</button>
        </form>

        <div class="login-footer-hint">
            Default Admin: <strong>admin / admin123</strong>
            <br>
            <span style="font-size: 0.8rem; color: #94a3b8; display: inline-block; margin-top: 6px;">Customer Login: <strong>john / password123</strong></span>
        </div>
    </div>
</body>
</html>
